<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cpuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="40" fill="#1e40af" opacity="0.1"/>
  <circle cx="700" cy="320" r="60" fill="#1e40af" opacity="0.1"/>
  
  <!-- Main CPU Icon Container -->
  <g transform="translate(150, 200)">
    <!-- CPU pins/connectors (dots around the chip) -->
    <g>
      <!-- Top pins -->
      <circle cx="-30" cy="-75" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-75" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="-75" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      
      <!-- Right pins -->
      <circle cx="75" cy="-30" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.4s"/>
      </circle>
      <circle cx="75" cy="0" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle cx="75" cy="30" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      
      <!-- Bottom pins -->
      <circle cx="30" cy="75" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      </circle>
      <circle cx="0" cy="75" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <circle cx="-30" cy="75" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      
      <!-- Left pins -->
      <circle cx="-75" cy="30" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="-75" cy="0" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1.1s"/>
      </circle>
      <circle cx="-75" cy="-30" r="5" fill="#60a5fa">
        <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
    </g>
    
    <!-- CPU Chip Body -->
    <g filter="url(#shadow)">
      <!-- Main CPU square -->
      <rect x="-50" y="-50" width="100" height="100" 
            fill="url(#cpuGradient)" stroke="#fff" stroke-width="3" rx="8"/>
      
      <!-- CPU circuit lines -->
      <line x1="-35" y1="-25" x2="35" y2="-25" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <line x1="-35" y1="25" x2="35" y2="25" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <line x1="-25" y1="-35" x2="-25" y2="35" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <line x1="25" y1="-35" x2="25" y2="35" stroke="#fff" stroke-width="2" opacity="0.3"/>
      
      <!-- WiFi symbol in center of CPU -->
      <g transform="translate(0, 5)">
        <path d="M -20,-10 Q -12,-18 0,-18 Q 12,-18 20,-10" 
              fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
        <path d="M -13,-5 Q -8,-10 0,-10 Q 8,-10 13,-5" 
              fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
        <path d="M -6,0 Q -3,-3 0,-3 Q 3,-3 6,0" 
              fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
        <circle cx="0" cy="5" r="3" fill="#fff"/>
      </g>
    </g>
    
    <!-- Connecting lines from CPU to pins -->
    <line x1="-30" y1="-50" x2="-30" y2="-75" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-50" x2="0" y2="-75" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="-50" x2="30" y2="-75" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    
    <line x1="50" y1="-30" x2="75" y2="-30" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="0" x2="75" y2="0" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="30" x2="75" y2="30" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    
    <line x1="30" y1="50" x2="30" y2="75" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="50" x2="0" y2="75" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <line x1="-30" y1="50" x2="-30" y2="75" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    
    <line x1="-50" y1="30" x2="-75" y2="30" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <line x1="-50" y1="0" x2="-75" y2="0" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <line x1="-50" y1="-30" x2="-75" y2="-30" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Company Name -->
  <g transform="translate(340, 200)">
    <text x="0" y="-10" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" filter="url(#shadow)">
      ChezaTek Solutions
    </text>
    <text x="0" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="300" fill="#93c5fd" letter-spacing="4">
      LIMITED
    </text>
    
    <!-- Tagline -->
    <text x="0" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#bfdbfe" font-style="italic">
      Smart Computing & Wireless Solutions
    </text>
  </g>
  
  <!-- Decorative line -->
  <line x1="340" y1="245" x2="620" y2="245" stroke="#60a5fa" stroke-width="2" opacity="0.5">
    <animate attributeName="x2" from="340" to="620" dur="1.5s" fill="freeze"/>
  </line>
</svg>